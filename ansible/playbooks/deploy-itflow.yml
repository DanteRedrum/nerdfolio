---
# Provision and deploy ITFlow on a dedicated VM
# Usage: ansible-playbook ansible/playbooks/deploy-itflow.yml -i ansible/inventory/hosts.yml
#
# Prerequisites:
#   - VM provisioned (Ubuntu 22.04 / Debian 12)
#   - Host added to [itflow] group in inventory
#   - docker/itflow/.env present on control node

- name: Deploy ITFlow
  hosts: itflow
  become: true

  vars:
    deploy_user: "{{ ansible_user }}"
    app_dir: /opt/itflow
    compose_src: "{{ playbook_dir }}/../../docker/itflow"

  tasks:

    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
        update_cache: true

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Add deploy user to docker group
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        mode: "0750"

    - name: Copy compose file
      ansible.builtin.copy:
        src: "{{ compose_src }}/docker-compose.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: "{{ deploy_user }}"
        mode: "0640"

    - name: Copy .env file
      ansible.builtin.copy:
        src: "{{ compose_src }}/.env"
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        mode: "0600"

    - name: Create proxy network if not exists
      community.docker.docker_network:
        name: proxy
        state: present

    - name: Pull latest images
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        pull: always
        state: present

    - name: Start ITFlow stack
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present

    - name: Verify containers are running
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ app_dir }}"
      register: compose_status
      changed_when: false

    - name: Show stack status
      ansible.builtin.debug:
        var: compose_status.stdout_lines
