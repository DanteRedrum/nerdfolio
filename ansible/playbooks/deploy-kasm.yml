# NOTE: This playbook downloads and runs the Kasm installer non-interactively.
# Credentials are generated randomly and printed to stdout during install.
# After running this playbook, SSH into nf-kasm-ubuntu and run:
#   sudo bash /tmp/kasm_release/install.sh
# to see credentials. Save them to Vaultwarden immediately.
# The -n flag attempts non-interactive install but credentials may not be captured.
# Manual install is recommended to capture credentials from stdout.
---
- name: Deploy Kasm Workspaces
  hosts: nf-kasm-ubuntu
  become: true

  vars:
    kasm_version: "1.18.1"
    kasm_install_dir: /tmp

  tasks:
    - name: Download Kasm installer
      get_url:
        url: "https://kasm-static-content.s3.amazonaws.com/kasm_release_{{ kasm_version }}.tar.gz"
        dest: "{{ kasm_install_dir }}/kasm_release_{{ kasm_version }}.tar.gz"
        mode: '0644'

    - name: Extract Kasm installer
      unarchive:
        src: "{{ kasm_install_dir }}/kasm_release_{{ kasm_version }}.tar.gz"
        dest: "{{ kasm_install_dir }}"
        remote_src: yes

    - name: Run Kasm installer
      shell: |
        bash /tmp/kasm_release/install.sh --accept-eula -n
      args:
        creates: /opt/kasm

    - name: Report
      debug:
        msg: "Kasm deployed — https://192.168.100.40"
