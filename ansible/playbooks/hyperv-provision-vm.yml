---
- name: Provision a Hyper-V VM
  hosts: windows
  gather_facts: false
  become: false

  vars:
    vm_name: "nf-test-vm"
    vm_ram: 2147483648
    vm_disk_size: 42949672960
    vm_switch: "vSwitch-Internal"
    vm_generation: 2
    vm_cpu: 2
    vm_vhd_dir: "D:\\Hyper-V\\Virtual Hard Disks"

  tasks:
    - name: Check if VM already exists
      ansible.windows.win_powershell:
        script: |
          $vm = Get-VM -Name "{{ vm_name }}" -ErrorAction SilentlyContinue
          if ($vm) { $Ansible.Result = "exists" } else { $Ansible.Result = "absent" }
      register: vm_check
      changed_when: false

    - name: Create VM
      ansible.windows.win_powershell:
        script: |
          $vhdPath = "{{ vm_vhd_dir }}\{{ vm_name }}.vhdx"
          New-VM -Name "{{ vm_name }}" -Generation {{ vm_generation }} -MemoryStartupBytes {{ vm_ram }} -NewVHDPath $vhdPath -NewVHDSizeBytes {{ vm_disk_size }} -SwitchName "{{ vm_switch }}"
      when: vm_check.result == "absent"

    - name: Disable dynamic memory
      ansible.windows.win_powershell:
        script: |
          Set-VMMemory -VMName "{{ vm_name }}" -DynamicMemoryEnabled $false
      when: vm_check.result == "absent"

    - name: Set CPU count
      ansible.windows.win_powershell:
        script: |
          Set-VMProcessor -VMName "{{ vm_name }}" -Count {{ vm_cpu }}
      when: vm_check.result == "absent"

    - name: Configure secure boot for Linux
      ansible.windows.win_powershell:
        script: |
          Set-VMFirmware -VMName "{{ vm_name }}" -SecureBootTemplate "MicrosoftUEFICertificateAuthority"
      when: vm_check.result == "absent"

    - name: Report result
      debug:
        msg: "{{ vm_name }} {{ 'already exists — skipped' if vm_check.result == 'exists' else 'provisioned successfully' }}"
