---
- name: Deploy Security Stack
  hosts: nf-security-ubuntu
  become: true

  tasks:
    - name: Create security directory
      file:
        path: /opt/nerdfolio/security
        state: directory
        mode: '0755'

    - name: Set vm.max_map_count for Wazuh indexer
      sysctl:
        name: vm.max_map_count
        value: '262144'
        state: present
        reload: yes

    - name: Install curl and tar
      apt:
        name:
          - curl
          - tar
        state: present

    - name: Download Wazuh docker deployment
      get_url:
        url: https://github.com/wazuh/wazuh-docker/archive/refs/tags/v4.7.3.tar.gz
        dest: /opt/nerdfolio/security/wazuh-docker.tar.gz
        mode: '0644'

    - name: Extract Wazuh docker deployment
      unarchive:
        src: /opt/nerdfolio/security/wazuh-docker.tar.gz
        dest: /opt/nerdfolio/security/
        remote_src: yes
        creates: /opt/nerdfolio/security/wazuh-docker-4.7.3

    - name: Generate Wazuh indexer certificates
      community.docker.docker_compose_v2:
        project_src: /opt/nerdfolio/security/wazuh-docker-4.7.3/single-node
        files:
          - generate-indexer-certs.yml
        state: present
      register: cert_result

    - name: Remove cert generator container
      community.docker.docker_compose_v2:
        project_src: /opt/nerdfolio/security/wazuh-docker-4.7.3/single-node
        files:
          - generate-indexer-certs.yml
        state: absent

    - name: Deploy Wazuh single node stack
      community.docker.docker_compose_v2:
        project_src: /opt/nerdfolio/security/wazuh-docker-4.7.3/single-node
        files:
          - docker-compose.yml
        state: present

    - name: Copy CyberChef compose file
      copy:
        src: ../../docker/compose/security/cyberchef.yml
        dest: /opt/nerdfolio/security/cyberchef.yml
        mode: '0644'

    - name: Deploy CyberChef
      community.docker.docker_compose_v2:
        project_src: /opt/nerdfolio/security
        files:
          - cyberchef.yml
        state: present

    - name: Report
      debug:
        msg:
          - "Wazuh Dashboard — https://192.168.100.50"
          - "CyberChef — http://192.168.100.50:8000"
