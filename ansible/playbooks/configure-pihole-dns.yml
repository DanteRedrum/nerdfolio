---
- name: Configure Pi-hole Local DNS Records
  hosts: nf-docker-ubuntu
  become: false
  gather_facts: false

  vars:
    pihole_url: "http://localhost/api"
    dns_records:
      - "192.168.100.20 portainer.nerdfolio"
      - "192.168.100.20 pihole.nerdfolio"
      - "192.168.100.20 npm.nerdfolio"
      - "192.168.100.20 uptime.nerdfolio"
      - "192.168.100.20 vault.nerdfolio"
      - "192.168.100.20 git.nerdfolio"
      - "192.168.100.20 code.nerdfolio"
      - "192.168.100.20 dash.nerdfolio"
      - "192.168.100.20 pdf.nerdfolio"
      - "192.168.100.20 ai.nerdfolio"
      - "192.168.100.50 wazuh.nerdfolio"

  tasks:
    - name: Authenticate with Pi-hole API
      community.docker.docker_container_exec:
        container: pihole
        command: >
          curl -s -X POST http://localhost/api/auth
          -H "Content-Type: application/json"
          -d '{"password":"{{ pihole_password }}"}'
      register: auth_response

    - name: Parse session token
      set_fact:
        pihole_sid: "{{ (auth_response.stdout | from_json).session.sid }}"
        pihole_csrf: "{{ (auth_response.stdout | from_json).session.csrf }}"

    - name: Fail if authentication failed
      fail:
        msg: "Pi-hole authentication failed"
      when: not (auth_response.stdout | from_json).session.valid

    - name: Build DNS hosts JSON payload
      set_fact:
        dns_payload: "{{ {'config': {'dns': {'hosts': dns_records}}} | to_json }}"

    - name: Set DNS records via Pi-hole v6 API
      community.docker.docker_container_exec:
        container: pihole
        command: >
          curl -s -X PATCH http://localhost/api/config
          -H "Content-Type: application/json"
          -H "X-FTL-SID: {{ pihole_sid }}"
          -H "X-FTL-CSRF: {{ pihole_csrf }}"
          -d '{{ dns_payload }}'
      register: dns_result

    - name: Verify DNS records set
      community.docker.docker_container_exec:
        container: pihole
        command: >
          curl -s -X GET http://localhost/api/config/dns/hosts
          -H "X-FTL-SID: {{ pihole_sid }}"
          -H "X-FTL-CSRF: {{ pihole_csrf }}"
      register: verify_result

    - name: Report
      debug:
        msg: "{{ (verify_result.stdout | from_json).config.dns.hosts }}"
